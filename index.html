<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Forex Insight AI v7.0 Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #04060d; --s1: #080e1a; --s2: #0d1525; --s3: #111d30; --s4: #16243b;
            --bd: #1e3050; --bd2: #2a4060;
            --acc: #00f0c8; --acc2: #6c3fff; --acc3: #ff6b35;
            --buy: #06d672; --sell: #ff2d55; --amber: #ffa500;
            --txt: #c8d8f0; --muted: #4a6890; --dim: #1a2d48;
            --fh: 'Space Grotesk', sans-serif;
            --fm: 'JetBrains Mono', monospace;
            --fd: 'Bebas Neue', sans-serif;
        }
        body {
            background: var(--bg); color: var(--txt); font-family: var(--fh);
            margin: 0; padding: 0; min-height: 100vh; transition: background 0.3s;
        }
        #app { display: flex; flex-direction: column; min-height: 100vh; }
        .header {
            background: var(--s1); border-bottom: 1px solid var(--bd);
            display: flex; align-items: center; padding: 0 16px; height: 56px; gap: 12px;
        }
        .logo-box {
            width: 32px; height: 32px; border-radius: 8px;
            background: linear-gradient(135deg, var(--acc), var(--acc2));
            display: flex; align-items: center; justify-content: center;
            font-family: var(--fd); font-size: 16px; color: #020c18;
        }
        .ticker-wrap {
            background: var(--s2); border-bottom: 1px solid var(--bd);
            overflow: hidden; display: flex; align-items: center; height: 32px;
        }
        .ticker-inner {
            display: flex; white-space: nowrap;
            animation: scroll 60s linear infinite;
        }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .body { display: flex; flex: 1; min-height: calc(100vh - 112px); }
        .sidebar {
            width: 200px; background: var(--s1); border-right: 1px solid var(--bd);
            display: flex; flex-direction: column; padding: 12px; gap: 8px;
        }
        .nav-item {
            background: transparent; border: none; color: var(--muted);
            padding: 10px; text-align: left; cursor: pointer;
            font-family: var(--fh); font-size: 13px; border-radius: 6px;
            transition: 0.2s; display: flex; align-items: center; gap: 10px;
        }
        .nav-item.active { color: var(--acc); background: rgba(0, 240, 200, 0.1); }
        .main { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .footer {
            background: var(--s1); border-top: 1px solid var(--bd);
            display: flex; align-items: center; padding: 0 16px; height: 24px;
            font-family: var(--fm); font-size: 9px; color: var(--muted);
        }
        .card { background: var(--s1); border: 1px solid var(--bd); border-radius: 12px; padding: 16px; }
        .card2 { background: var(--s2); border: 1px solid var(--bd); border-radius: 8px; padding: 10px; }
        .grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
        .btn {
            padding: 6px 12px; border-radius: 6px; cursor: pointer;
            font-family: var(--fh); font-weight: 600; font-size: 12px;
            border: none; transition: 0.2s;
        }
        .btn-acc { background: var(--acc); color: #020c18; }
        .btn-ghost { background: var(--s3); color: var(--txt); border: 1px solid var(--bd); }
        .pair-pill {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px; border-radius: 6px; cursor: pointer;
            background: var(--s2); border: 1px solid var(--bd); margin-bottom: 4px;
            font-family: var(--fm); font-size: 11px;
        }
        .pair-pill.active { border-color: var(--acc); background: rgba(0, 240, 200, 0.1); }
        .sig-card {
            border-radius: 12px; padding: 16px; border: 1px solid var(--bd);
            background: var(--s1); transition: 0.3s;
        }
        .sig-card.buy { border-left: 4px solid var(--buy); background: linear-gradient(90deg, rgba(6,214,114,0.05), transparent); }
        .sig-card.sell { border-left: 4px solid var(--sell); background: linear-gradient(90deg, rgba(255,45,85,0.05), transparent); }
        .pill { padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: bold; }
        .pill-buy { background: rgba(6,214,114,0.2); color: var(--buy); }
        .pill-sell { background: rgba(255,45,85,0.2); color: var(--sell); }
        .conf-bar { height: 4px; background: var(--s3); border-radius: 2px; margin-top: 4px; overflow: hidden; }
        .conf-fill { height: 100%; transition: width 0.5s ease; }

        /* Modal Styles */
        .modal-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal {
            background: var(--s1); border: 1px solid var(--bd2); border-radius: 16px;
            padding: 24px; width: 350px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .inp {
            width: 100%; background: var(--s2); border: 1px solid var(--bd);
            color: var(--txt); padding: 10px; border-radius: 6px; font-family: var(--fm);
            margin: 10px 0 20px 0; outline: none;
        }
        .inp:focus { border-color: var(--acc); }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="modal-root"></div>
    <div id="toast-root" style="position:fixed; top:60px; right:20px; z-index:1000; display:flex; flex-direction:column; gap:8px;"></div>

    <script>
        'use strict';
        const PAIRS = {
            EURUSD:{pip:.0001,d:5,sp:.00012,sess:'EU/US',flag:'🇪🇺🇺🇸',base:1.08542},
            GBPUSD:{pip:.0001,d:5,sp:.00018,sess:'UK/US',flag:'🇬🇧🇺🇸',base:1.27183},
            USDJPY:{pip:.01,  d:3,sp:.018,  sess:'AS/US',flag:'🇺🇸🇯🇵',base:149.832},
            AUDUSD:{pip:.0001,d:5,sp:.0002, sess:'AS/US',flag:'🇦🇺🇺🇸',base:0.65421},
            USDCAD:{pip:.0001,d:5,sp:.0002, sess:'US/CA',flag:'🇺🇸🇨🇦',base:1.36214},
            USDCHF:{pip:.0001,d:5,sp:.0002, sess:'EU/US',flag:'🇺🇸🇨🇭',base:0.89732},
            NZDUSD:{pip:.0001,d:5,sp:.00025,sess:'AS/US',flag:'🇳🇿🇺🇸',base:0.60187},
            EURGBP:{pip:.0001,d:5,sp:.00016,sess:'EU',   flag:'🇪🇺🇬🇧',base:0.85421},
        };
        const SYMS = Object.keys(PAIRS);

        const S = {
            tab: 'dashboard', pair: 'EURUSD', theme: 'dark',
            prices: {}, candles: {},
            src: 'simulation',
            apiKey: localStorage.getItem('polygon_key') || '',
            watchlist: ['EURUSD', 'GBPUSD', 'USDJPY'],
            btResult: null, btRunning: false
        };

        function initData() {
            SYMS.forEach(s => {
                const base = PAIRS[s].base;
                S.prices[s] = { bid: base, ask: base + PAIRS[s].sp, mid: base, chg: 0, pct: 0, vol: 0, src: 'seed' };
                S.candles[s] = _genSeedCandles(s, base);
            });
        }

        function _genSeedCandles(sym, base, n=100) {
            let p = base; const vol = PAIRS[sym].pip * 4;
            const candles = [];
            for(let i=0; i<n; i++) {
                const o = p, d = (Math.random()-.5)*vol*2, c = o+d;
                p = c;
                candles.push({ t: Date.now()-(n-i)*60000, o, h: Math.max(o,c)+0.0001, l: Math.min(o,c)-0.0001, c, v: Math.floor(Math.random()*1000) });
            }
            return candles;
        }

        const _ema = (d, p) => {
            const k = 2/(p+1);
            const res = [];
            for(let i=0; i<d.length; i++) {
                if(i===0) res.push(d[i]);
                else res.push(d[i]*k + res[i-1]*(1-k));
            }
            return res;
        };
        const _rsi = (c) => {
            if(c.length < 15) return 50;
            let gains = 0, losses = 0;
            for(let i=c.length-14; i<c.length; i++) {
                let diff = c[i] - c[i-1];
                diff > 0 ? gains += diff : losses -= diff;
            }
            return 100 - (100 / (1 + (gains/14) / (losses/14 || 1)));
        };

        function computeSignal(sym) {
            const cl = S.candles[sym].map(c => c.c);
            const last = cl[cl.length-1];
            const rsi = _rsi(cl);
            const ema20 = _ema(cl, 20).pop();
            const ema50 = _ema(cl, 50).pop();

            let score = 0;
            if (rsi < 30) score++; else if (rsi > 70) score--;
            if (ema20 > ema50) score++; else score--;

            const dir = score >= 0 ? 'BUY' : 'SELL';
            const conf = 50 + Math.abs(score) * 15;
            return { dir, conf, rsi, last };
        }

        function showSettings() {
            const root = document.getElementById('modal-root');
            root.innerHTML = `
                <div class="modal-bg" onclick="this.remove()">
                    <div class="modal" onclick="event.stopPropagation()">
                        <h2 style="font-family:var(--fd); color:var(--acc); margin-bottom:10px">API SETTINGS</h2>
                        <p style="font-size:11px; color:var(--muted); margin-bottom:15px">Enter your Polygon.io API Key for real-time tick data.</p>
                        <label style="font-size:10px; color:var(--muted); font-family:var(--fm)">POLYGON API KEY</label>
                        <input class="inp" type="password" id="key-inp" value="${S.apiKey}" placeholder="PK-xxxxxxxx...">
                        <button class="btn btn-acc" style="width:100%" onclick="saveKey()">SAVE & CONNECT</button>
                    </div>
                </div>
            `;
        }

        function saveKey() {
            const key = document.getElementById('key-inp').value;
            S.apiKey = key;
            localStorage.setItem('polygon_key', key);
            document.getElementById('modal-root').innerHTML = '';
            connectWebSocket();
            render();
        }

        let ws = null;
        function connectWebSocket() {
            if (!S.apiKey) {
                S.src = 'simulation';
                return;
            }

            if (ws) ws.close();

            // Use the correct Polygon WebSocket endpoint
            const url = `wss://socket.polygon.io/forex`;
            ws = new WebSocket(url);

            ws.onopen = () => {
                S.src = 'Polygon.io';
                // Authenticate
                ws.send(JSON.stringify({ action: 'auth', params: S.apiKey }));
                // Subscribe to all symbols in our registry
                SYMS.forEach(s => {
                    // Polygon Forex format: C.EURUSD
                    ws.send(JSON.stringify({ action: 'subscribe', params: `C.${s}` }));
                });
                render();
            };

            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (Array.isArray(data)) {
                    data.forEach(tick => {
                        const sym = tick.sym.replace('C.', '');
                        if (PAIRS[sym]) {
                            const price = tick.p;
                            S.prices[sym].mid = price;
                            S.prices[sym].bid = price - PAIRS[sym].sp/2;
                            S.prices[sym].ask = price + PAIRS[sym].sp/2;

                            // Update candles
                            const cc = S.candles[sym];
                            const last = cc[cc.length-1];
                            if (Date.now() - last.t > 60000) {
                                cc.push({ t: Date.now(), o: price, h: price, l: price, c: price, v: 1 });
                                if(cc.length > 200) cc.shift();
                            } else {
                                last.c = price;
                                last.h = Math.max(last.h, price);
                                last.l = Math.min(last.l, price);
                            }
                        }
                    });
                    render();
                }
            };

            ws.onerror = () => {
                S.src = 'Simulation (Error)';
                render();
            };

            ws.onclose = () => {
                S.src = 'Disconnected';
                render();
            };
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            const tickerItems = SYMS.map(s => {
                const p = S.prices[s];
                return `<div style="display:inline-flex; align-items:center; gap:10px; padding:0 20px; border-right:1px solid var(--bd); font-family:var(--fm); font-size:10px;">
                    <span>${PAIRS[s].flag} ${s}</span>
                    <span style="font-weight:bold">${p.bid.toFixed(PAIRS[s].d)}</span>
                    <span style="color:var(--buy)">+0.02%</span>
                </div>`;
            }).join('');

            const sidebarItems = SYMS.map(s => `
                <div class="pair-pill ${S.pair === s ? 'active' : ''}" onclick="S.pair='${s}'; S.tab='dashboard'; render()">
                    <span>${s}</span>
                    <span style="color:var(--acc)">${S.prices[s].bid.toFixed(PAIRS[s].d)}</span>
                </div>
            `).join('');

            let content = '';
            if (S.tab === 'dashboard') {
                const p = S.prices[S.pair];
                content = `
                    <div class="main">
                        <div class="card">
                            <h2 style="font-family:var(--fd); font-size:24px; margin-bottom:10px">${PAIRS[S.pair].flag} ${S.pair}</h2>
                            <div style="font-family:var(--fm); font-size:32px; font-weight:bold; color:var(--acc)">${p.bid.toFixed(PAIRS[S.pair].d)}</div>
                            <div style="font-family:var(--fm); font-size:12px; color:var(--muted)">Source: ${S.src} | Spread: ${PAIRS[S.pair].sp}</div>
                        </div>
                        <div class="grid-auto">
                            <div class="card2">
                                <div style="font-size:10px; color:var(--muted)">CURRENT TREND</div>
                                <div style="font-family:var(--fm); font-size:16px; color:var(--buy)">BULLISH</div>
                            </div>
                            <div class="card2">
                                <div style="font-size:10px; color:var(--muted)">VOLATILITY</div>
                                <div style="font-family:var(--fm); font-size:16px; color:var(--txt)">LOW</div>
                            </div>
                        </div>
                        <div class="card" style="height:300px; display:flex; align-items:center; justify-content:center; background:var(--s2); border: 1px dashed var(--bd)">
                            <div style="color:var(--muted); font-family:var(--fm)">Real-time Candle Engine Active</div>
                        </div>
                    </div>
                `;
            } else if (S.tab === 'signals') {
                const signalCards = SYMS.map(s => {
                    const sig = computeSignal(s);
                    return `
                        <div class="sig-card ${sig.dir.toLowerCase()}">
                            <div style="display:flex; justify-content:space-between; margin-bottom:10px">
                                <span style="font-weight:bold">${PAIRS[s].flag} ${s}</span>
                                <span class="pill ${sig.dir === 'BUY' ? 'pill-buy' : 'pill-sell'}">${sig.dir}</span>
                            </div>
                            <div style="font-size:11px; color:var(--muted)">Confidence: ${sig.conf}%</div>
                            <div class="conf-bar"><div class="conf-fill" style="width:${sig.conf}%; background:var(--acc)"></div></div>
                            <div style="margin-top:10px; font-family:var(--fm); font-size:10px; display:flex; justify-content:space-between">
                                <span>RSI: ${Math.round(sig.rsi)}</span>
                                <span>Price: ${sig.last.toFixed(PAIRS[s].d)}</span>
                            </div>
                        </div>
                    `;
                }).join('');

                content = `
                    <div class="main">
                        <h1 style="font-family:var(--fd); font-size:22px; color:var(--acc)">AI SIGNALS</h1>
                        <div class="grid-auto">${signalCards}</div>
                    </div>
                `;
            } else {
                content = `<div class="main"><h1 style="font-family:var(--fd); color:var(--acc)">${S.tab.toUpperCase()}</h1><div class="card">Coming soon in v7.1</div></div>`;
            }

            app.innerHTML = `
                <div class="header">
                    <div class="logo-box">FX</div>
                    <div style="font-family:var(--fd); font-size:18px; letter-spacing:1px; color:var(--txt)">
                        FOREX <span style="color:var(--acc)">INSIGHT AI</span>
                    </div>
                    <div style="flex:1"></div>
                    <button class="btn btn-ghost" style="margin-right:8px" onclick="showSettings()">⚙ SETTINGS</button>
                    <button class="btn btn-ghost" onclick="S.theme = S.theme === 'dark' ? 'lm' : 'dark'; document.body.className = S.theme; render()">
                        ${S.theme === 'dark' ? '☀️' : '🌙'}
                    </button>
                </div>
                <div class="ticker-wrap">
                    <div class="ticker-inner">${tickerItems}${tickerItems}</div>
                </div>
                <div class="body">
                    <div class="sidebar">
                        <button class="nav-item ${S.tab === 'dashboard' ? 'active' : ''}" onclick="S.tab='dashboard'; render()">◈ Dashboard</button>
                        <button class="nav-item ${S.tab === 'signals' ? 'active' : ''}" onclick="S.tab='signals'; render()">◎ Signals</button>
                        <button class="nav-item ${S.tab === 'watchlist' ? 'active' : ''}" onclick="S.tab='watchlist'; render()">◉ Watchlist</button>
                        <div style="margin-top:auto; padding-top:10px; border-top:1px solid var(--bd); font-size:10px; color:var(--muted)">
                            LIVE PAIRS
                            ${sidebarItems}
                        </div>
                    </div>
                    ${content}
                </div>
                <div class="footer">
                    <span style="color:var(--buy)">● LIVE</span> &nbsp; Forex Insight AI v7.0 Pro | Data: ${S.src}
                </div>
            `;
        }

        function _simTick() {
            if (S.src === 'Polygon.io') return; // Don't simulate if we have real data
            SYMS.forEach(s => {
                const p = S.prices[s];
                const noise = (Math.random() - 0.5) * PAIRS[s].pip * 2;
                p.mid += noise;
                p.bid = p.mid - PAIRS[s].sp/2;
                p.ask = p.mid + PAIRS[s].sp/2;
                const cc = S.candles[s];
                const last = cc[cc.length-1];
                if (Date.now() - last.t > 60000) {
                    cc.push({ t: Date.now(), o: p.mid, h: p.mid, l: p.mid, c: p.mid, v: 1 });
                    if(cc.length > 200) cc.shift();
                } else {
                    last.c = p.mid;
                    last.h = Math.max(last.h, p.mid);
                    last.l = Math.min(last.l, p.mid);
                }
            });
            render();
        }

        // Bootstrap
        initData();
        connectWebSocket();
        render();
        setInterval(_simTick, 1000);

    </script>
</body>
</html>
