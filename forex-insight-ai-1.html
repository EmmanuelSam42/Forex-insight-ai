<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Forex Insight AI v7.3 Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg: #04060d; --s1: #080e1a; --s2: #0d1525; --s3: #111d30; --s4: #16243b;
            --bd: #1e3050; --bd2: #2a4060;
            --acc: #00f0c8; --acc2: #6c3fff; --acc3: #ff6b35;
            --buy: #06d672; --sell: #ff2d55; --amber: #ffa500;
            --txt: #c8d8f0; --muted: #4a6890; --dim: #1a2d48;
            --fh: 'Space Grotesk', sans-serif;
            --fm: 'JetBrains Mono', monospace;
            --fd: 'Bebas Neue', sans-serif;
        }
        body.lm {
            /* Surface stack: warm white → cool grey-blue */
            --bg:  #eef1f6;
            --s1:  #ffffff;
            --s2:  #f4f6fb;
            --s3:  #e6eaf3;
            --s4:  #d6dceb;
            /* Borders: crisp but not heavy */
            --bd:  #c4cfe3;
            --bd2: #96aace;
            /* Brand accent: deep teal */
            --acc:  #007a96;
            --acc2: #4f22c6;
            --acc3: #c94a00;
            /* Signal colours: vivid enough to read on white */
            --buy:   #0a7c45;
            --sell:  #c0132a;
            --amber: #b05f00;
            /* Text: near-black with blue undertone for depth */
            --txt:   #0b1829;
            --muted: #445e7a;
            --dim:   #dce3ef;
            /* Extras used only in lm overrides below */
            --lm-shadow-sm: 0 1px 4px rgba(30,60,100,0.08), 0 2px 8px rgba(30,60,100,0.05);
            --lm-shadow-md: 0 4px 16px rgba(30,60,100,0.12), 0 2px 6px rgba(30,60,100,0.07);
            --lm-shadow-lg: 0 8px 32px rgba(30,60,100,0.14), 0 2px 8px rgba(30,60,100,0.08);
            --lm-acc-glow:  0 4px 14px rgba(0,122,150,0.22);
            --lm-buy-glow:  0 4px 14px rgba(10,124,69,0.18);
            --lm-sell-glow: 0 4px 14px rgba(192,19,42,0.18);
        }

        /* ── Light mode structural overrides ── */
        body.lm .header {
            background: linear-gradient(135deg, #ffffff 0%, #f0f5ff 100%);
            border-bottom: 1px solid var(--bd);
            box-shadow: var(--lm-shadow-sm);
        }
        body.lm .sidebar {
            background: linear-gradient(180deg, #f8faff 0%, #f0f4fb 100%);
            border-right: 1px solid var(--bd);
            box-shadow: 2px 0 8px rgba(30,60,100,0.06);
        }
        body.lm .footer {
            background: linear-gradient(90deg, #f4f7fc, #eef2f9);
            border-top: 1px solid var(--bd);
        }
        body.lm .ticker-wrap {
            background: linear-gradient(90deg, #edf2fb, #f4f7fd);
            border-bottom: 1px solid var(--bd);
        }
        body.lm .card {
            background: #ffffff;
            border: 1px solid var(--bd);
            box-shadow: var(--lm-shadow-sm);
        }
        body.lm .card:hover {
            box-shadow: var(--lm-shadow-md);
            border-color: var(--bd2);
        }
        body.lm .card2 {
            background: var(--s2);
            border: 1px solid var(--bd);
            box-shadow: var(--lm-shadow-sm);
        }
        body.lm .sig-card {
            background: #ffffff;
            border: 1px solid var(--bd);
            box-shadow: var(--lm-shadow-sm);
        }
        body.lm .sig-card:hover {
            box-shadow: var(--lm-shadow-md);
            border-color: var(--acc);
        }
        body.lm .sig-card.buy {
            border-left: 3px solid var(--buy);
            background: linear-gradient(90deg, rgba(10,124,69,0.04), #ffffff);
        }
        body.lm .sig-card.sell {
            border-left: 3px solid var(--sell);
            background: linear-gradient(90deg, rgba(192,19,42,0.04), #ffffff);
        }
        body.lm .nav-item.active {
            background: linear-gradient(90deg, rgba(0,122,150,0.1), rgba(0,122,150,0.04));
            color: var(--acc);
            border-left: 2px solid var(--acc);
        }
        body.lm .nav-item:hover:not(.active) {
            background: rgba(0,122,150,0.05);
            color: var(--acc);
        }
        body.lm .btn-acc {
            background: linear-gradient(135deg, #007a96, #005f75);
            color: #ffffff;
            box-shadow: var(--lm-acc-glow);
        }
        body.lm .btn-acc:hover {
            box-shadow: 0 6px 20px rgba(0,122,150,0.35);
            filter: brightness(1.08);
        }
        body.lm .btn-ghost {
            background: #ffffff;
            border: 1px solid var(--bd);
            color: var(--muted);
            box-shadow: var(--lm-shadow-sm);
        }
        body.lm .btn-ghost:hover {
            background: var(--s3);
            border-color: var(--acc);
            color: var(--acc);
            box-shadow: var(--lm-shadow-sm);
        }
        body.lm .tf-btn {
            background: #ffffff;
            border: 1px solid var(--bd);
            color: var(--muted);
            box-shadow: var(--lm-shadow-sm);
        }
        body.lm .tf-btn.active {
            background: var(--acc);
            color: #ffffff;
            border-color: var(--acc);
            box-shadow: var(--lm-acc-glow);
        }
        body.lm .tf-btn:hover:not(.active) {
            background: var(--s3);
            border-color: var(--acc);
            color: var(--acc);
        }
        body.lm .logo-box {
            background: linear-gradient(135deg, var(--acc), var(--acc2));
            box-shadow: var(--lm-acc-glow);
        }
        body.lm .logo-box:hover {
            box-shadow: 0 0 20px rgba(0,122,150,0.4);
        }
        body.lm .session-monitor {
            background: var(--s2);
            border: 1px solid var(--bd);
            box-shadow: var(--lm-shadow-sm);
        }
        body.lm .session-dot.active {
            background: var(--buy);
            box-shadow: 0 0 8px rgba(10,124,69,0.5);
        }
        body.lm .pair-brief-card {
            background: #ffffff;
            border: 1px solid var(--bd);
            box-shadow: var(--lm-shadow-sm);
        }
        body.lm .pair-brief-card:hover {
            box-shadow: var(--lm-shadow-md);
            border-color: var(--acc);
        }
        body.lm .insight-met {
            background: #ffffff;
            border: 1px solid var(--bd);
            box-shadow: var(--lm-shadow-sm);
        }
        body.lm .insight-met:hover {
            box-shadow: var(--lm-shadow-md);
            border-color: var(--acc);
        }
        body.lm .rm-met {
            background: var(--s3);
            border: 1px solid var(--bd);
            box-shadow: var(--lm-shadow-sm);
        }
        body.lm .rule-box {
            background: #ffffff;
            border: 1px solid var(--bd);
            box-shadow: var(--lm-shadow-sm);
        }
        body.lm .rule-box:hover {
            background: var(--s2);
            border-color: var(--acc);
            box-shadow: var(--lm-shadow-md);
        }
        body.lm .conf-fill { background: var(--acc) !important; }
        body.lm .week-alert.warn  { background: rgba(176,95,0,0.06);  border-color: var(--amber); color: var(--amber); }
        body.lm .week-alert.danger{ background: rgba(192,19,42,0.06); border-color: var(--sell);  color: var(--sell); }
        body.lm .week-alert.good  { background: rgba(10,124,69,0.06); border-color: var(--buy);   color: var(--buy); }
        body.lm .ai-response-box  { background: #f7faff; border: 1px solid var(--bd); box-shadow: var(--lm-shadow-sm); }
        body.lm .ai-ask-inp { background: #ffffff; border: 1px solid var(--bd); box-shadow: var(--lm-shadow-sm); }
        body.lm .modal { background: #ffffff; box-shadow: 0 20px 60px rgba(30,60,100,0.18); }
        body.lm .rm-inp { background: var(--s2); border: 1px solid var(--bd); }
        body.lm .pill-buy  { background: rgba(10,124,69,0.12);  color: var(--buy); }
        body.lm .pill-sell { background: rgba(192,19,42,0.12); color: var(--sell); }
        body.lm .sidebar-clock { color: var(--acc); }
        /* Sidebar mini price active highlight */
        body.lm .sidebar-mini-price:hover { background: rgba(0,122,150,0.06); }
        /* Chart container in light mode */
        body.lm #tv-chart-container { filter: brightness(1.02) contrast(1.05); }
        body {
            background: var(--bg); color: var(--txt); font-family: var(--fh);
            margin: 0; padding: 0; min-height: 100vh; transition: background 0.2s, color 0.2s;
        }
        #app { display: flex; flex-direction: column; min-height: 100vh; }
        .header {
            background: var(--s1); border-bottom: 1px solid var(--bd);
            display: flex; align-items: center; padding: 0 16px; height: 56px; gap: 12px;
        }
        .logo-box {
            width: 32px; height: 32px; border-radius: 8px;
            background: linear-gradient(135deg, var(--acc), var(--acc2));
            display: flex; align-items: center; justify-content: center;
            font-family: var(--fd); font-size: 16px; color: #020c18;
        }
        .ticker-wrap {
            background: var(--s2); border-bottom: 1px solid var(--bd);
            overflow: hidden; display: flex; align-items: center; height: 32px;
        }
        .ticker-inner {
            display: flex; white-space: nowrap;
            animation: scroll 60s linear infinite;
        }
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .body { display: flex; flex: 1; min-height: calc(100vh - 112px); }
        .sidebar {
            width: 200px; background: var(--s1); border-right: 1px solid var(--bd);
            display: flex; flex-direction: column; padding: 12px; gap: 8px;
        }
        .nav-item {
            background: transparent; border: none; color: var(--muted);
            padding: 10px; text-align: left; cursor: pointer;
            font-family: var(--fh); font-size: 13px; border-radius: 6px;
            transition: 0.2s; display: flex; align-items: center; gap: 10px;
        }
        .nav-item.active { color: var(--acc); background: rgba(0, 240, 200, 0.1); }
        .main { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .footer {
            background: var(--s1); border-top: 1px solid var(--bd);
            display: flex; align-items: center; padding: 0 16px; height: 24px;
            font-family: var(--fm); font-size: 9px; color: var(--muted);
        }
        .card { background: var(--s1); border: 1px solid var(--bd); border-radius: 12px; padding: 16px; }
        .card2 { background: var(--s2); border: 1px solid var(--bd); border-radius: 8px; padding: 10px; }
        .grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
        .btn {
            padding: 6px 12px; border-radius: 6px; cursor: pointer;
            font-family: var(--fh); font-weight: 600; font-size: 12px;
            border: none; transition: 0.2s;
        }
        .btn-acc { background: var(--acc); color: #020c18; }
        .btn-ghost { background: var(--s3); color: var(--txt); border: 1px solid var(--bd); }
        .pair-pill {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px; border-radius: 6px; cursor: pointer;
            background: var(--s2); border: 1px solid var(--bd); margin-bottom: 4px;
            font-family: var(--fm); font-size: 11px;
        }
        .pair-pill.active { border-color: var(--acc); background: rgba(0, 240, 200, 0.1); }
        .sig-card {
            border-radius: 12px; padding: 16px; border: 1px solid var(--bd);
            background: var(--s1); transition: 0.3s;
        }
        .sig-card.buy { border-left: 4px solid var(--buy); background: linear-gradient(90deg, rgba(6,214,114,0.05), transparent); }
        .sig-card.sell { border-left: 4px solid var(--sell); background: linear-gradient(90deg, rgba(255,45,85,0.05), transparent); }
        .pill { padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: bold; }
        .pill-buy { background: rgba(6,214,114,0.2); color: var(--buy); }
        .pill-sell { background: rgba(255,45,85,0.2); color: var(--sell); }
        .conf-bar { height: 4px; background: var(--s3); border-radius: 2px; margin-top: 4px; overflow: hidden; }
        .conf-fill { height: 100%; transition: width 0.5s ease; }

        /* AI Insight tab styles */
        .insight-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .insight-met { background: var(--s2); border: 1px solid var(--bd); border-radius: 8px; padding: 12px 14px; }
        .insight-met-label { font-size: 9px; font-family: var(--fm); color: var(--muted); margin-bottom: 4px; letter-spacing: .06em; }
        .insight-met-val { font-size: 20px; font-weight: 600; font-family: var(--fm); }
        .pair-brief-card { background: var(--s2); border: 1px solid var(--bd); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
        .pair-brief-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .brief-badge { font-size: 9px; font-weight: bold; padding: 3px 8px; border-radius: 4px; font-family: var(--fm); }
        .brief-badge.bear { background: rgba(255,45,85,0.2); color: var(--sell); }
        .brief-badge.bull { background: rgba(6,214,114,0.2); color: var(--buy); }
        .brief-badge.neutral { background: rgba(255,165,0,0.2); color: var(--amber); }
        .brief-row { display: flex; justify-content: space-between; font-size: 11px; font-family: var(--fm); margin-bottom: 5px; }
        .brief-row span:first-child { color: var(--muted); }
        .brief-rr { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; font-family: var(--fm); padding-top: 8px; border-top: 1px solid var(--bd); margin-top: 4px; }
        .ai-response-box { background: var(--s2); border: 1px solid var(--bd2); border-radius: 10px; padding: 16px; margin-bottom: 16px; min-height: 80px; font-size: 13px; line-height: 1.7; color: var(--txt); }
        .ai-response-box.loading { color: var(--muted); font-style: italic; }
        .rm-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .rm-label { font-size: 11px; font-family: var(--fm); color: var(--muted); min-width: 170px; }
        .rm-val { font-size: 12px; font-weight: 600; font-family: var(--fm); color: var(--acc); min-width: 80px; text-align: right; }
        .rm-inp { flex: 1; background: var(--s3); border: 1px solid var(--bd); color: var(--txt); padding: 6px 8px; border-radius: 5px; font-family: var(--fm); font-size: 12px; }
        .rm-inp:focus { outline: none; border-color: var(--acc); }
        .rm-slider { flex: 1; accent-color: var(--acc); }
        .rm-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
        .rm-met { background: var(--s3); border-radius: 6px; padding: 10px 12px; }
        .rm-met-lbl { font-size: 9px; font-family: var(--fm); color: var(--muted); margin-bottom: 3px; }
        .rm-met-val { font-size: 18px; font-weight: 600; font-family: var(--fm); }
        .rule-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .rule-box { background: var(--s2); border: 1px solid var(--bd); border-radius: 8px; padding: 12px; }
        .rule-title { font-size: 11px; font-weight: 600; color: var(--acc); margin-bottom: 4px; font-family: var(--fm); }
        .rule-desc { font-size: 11px; color: var(--muted); line-height: 1.5; }
        .section-head { font-family: var(--fd); font-size: 18px; color: var(--acc); margin: 0 0 14px 0; letter-spacing: 1px; }
        .week-alert { border-radius: 8px; padding: 10px 14px; font-size: 12px; line-height: 1.6; margin-bottom: 14px; border-left: 3px solid; }
        .week-alert.warn { background: rgba(255,165,0,0.1); color: var(--amber); border-color: var(--amber); }
        .week-alert.danger { background: rgba(255,45,85,0.1); color: var(--sell); border-color: var(--sell); }
        .week-alert.good { background: rgba(6,214,114,0.1); color: var(--buy); border-color: var(--buy); }
        .ai-ask-bar { display: flex; gap: 8px; margin-bottom: 16px; }
        .ai-ask-inp { flex: 1; background: var(--s2); border: 1px solid var(--bd); color: var(--txt); padding: 10px 14px; border-radius: 8px; font-family: var(--fh); font-size: 13px; }
        .ai-ask-inp:focus { outline: none; border-color: var(--acc); }
        .tf-selector { display: flex; gap: 4px; flex-wrap: wrap; }
        .tf-btn { background: var(--s3); border: 1px solid var(--bd); color: var(--muted); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-family: var(--fm); font-size: 10px; transition: 0.2s; }
        .tf-btn.active, .tf-btn:hover { background: var(--acc); color: #020c18; border-color: var(--acc); }
        .session-monitor { background: var(--s2); border: 1px solid var(--bd); border-radius: 8px; padding: 10px; margin-top: 10px; }
        .session-item { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 10px; font-family: var(--fm); }
        .session-label { color: var(--muted); }
        .session-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bd); }
        .session-dot.active { background: var(--buy); box-shadow: 0 0 6px var(--buy); }

        .modal-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal {
            background: var(--s1); border: 1px solid var(--bd2); border-radius: 16px;
            padding: 24px; width: 350px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .inp {
            width: 100%; background: var(--s2); border: 1px solid var(--bd);
            color: var(--txt); padding: 10px; border-radius: 6px; font-family: var(--fm);
            margin: 10px 0 20px 0; outline: none;
        }
        .inp:focus { border-color: var(--acc); }

        /* ── Hover effects ── */
        .nav-item:hover:not(.active) {
            color: var(--txt);
            background: var(--s3);
            padding-left: 14px;
        }
        .nav-item { transition: color 0.18s, background 0.18s, padding-left 0.18s; }

        .btn-acc:hover {
            filter: brightness(1.15);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(0, 240, 200, 0.35);
        }
        .btn-ghost:hover {
            background: var(--s4);
            border-color: var(--bd2);
            color: var(--acc);
            transform: translateY(-1px);
        }
        .btn { transition: background 0.15s, color 0.15s, transform 0.15s, box-shadow 0.15s, filter 0.15s; }
        .btn:active { transform: translateY(0) !important; filter: brightness(0.92); }

        .tf-btn:hover:not(.active) {
            background: var(--s4);
            color: var(--txt);
            border-color: var(--acc);
        }

        .card { transition: box-shadow 0.2s, border-color 0.2s; }
        .card:has(+ .card):hover,
        .card2:hover {
            border-color: var(--bd2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.18);
        }

        .sig-card { transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s; }
        .sig-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.22);
            border-color: var(--acc);
        }

        .pair-pill { transition: background 0.15s, border-color 0.15s, transform 0.15s; }
        .pair-pill:hover:not(.active) {
            background: var(--s3);
            border-color: var(--bd2);
            transform: translateX(2px);
        }

        .pair-brief-card { transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s; }
        .pair-brief-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            border-color: var(--acc);
        }

        .insight-met { transition: background 0.15s, border-color 0.15s, transform 0.15s; }
        .insight-met:hover {
            background: var(--s3);
            border-color: var(--bd2);
            transform: translateY(-1px);
        }

        .rm-met { transition: background 0.15s, transform 0.15s; }
        .rm-met:hover {
            background: var(--s4);
            transform: translateY(-1px);
        }

        .rule-box { transition: background 0.15s, border-color 0.15s, transform 0.15s; }
        .rule-box:hover {
            background: var(--s3);
            border-color: var(--acc);
            transform: translateY(-1px);
        }

        .logo-box { transition: transform 0.2s, box-shadow 0.2s; cursor: default; }
        .logo-box:hover {
            transform: rotate(8deg) scale(1.08);
            box-shadow: 0 0 16px rgba(0,240,200,0.4);
        }

        .session-item { transition: background 0.15s; border-radius: 4px; padding: 4px 4px; }
        .session-item:hover { background: var(--s3); }

        .week-alert { transition: transform 0.15s, box-shadow 0.15s; }
        .week-alert:hover {
            transform: translateX(2px);
            box-shadow: 2px 4px 14px rgba(0,0,0,0.15);
        }

        .ai-response-box { transition: border-color 0.2s; }
        .ai-response-box:hover { border-color: var(--bd2); }

        .rm-inp:hover { border-color: var(--bd2); }
        .rm-inp { transition: border-color 0.15s; }

        /* Ticker pause on hover */
        .ticker-wrap:hover .ticker-inner { animation-play-state: paused; }

        /* Pair grid cards (inline style — target via attribute) */
        [onclick*="S.pair="] { transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s, background 0.15s; }
        [onclick*="S.pair="]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        /* MTF signal boxes */
        [style*="background:var(--s3); border-radius:8px; padding:10px; text-align:center"] {
            transition: background 0.15s, transform 0.15s;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
        @keyframes pulse-dot { 0%,100%{box-shadow:0 0 4px var(--buy)} 50%{box-shadow:0 0 10px var(--buy)} }

        .sidebar-mini-price:hover { background:var(--s3); }
        .sidebar-clock { font-family:var(--fm); font-size:13px; font-weight:600; color:var(--acc); text-align:center; letter-spacing:.05em; margin-bottom:2px; }
        .sidebar-date { font-family:var(--fm); font-size:9px; color:var(--muted); text-align:center; margin-bottom:8px; }
        .ai-cursor { animation: blink 0.8s infinite; margin-left:2px; }
        #ai-chat-history::-webkit-scrollbar { width:4px; }
        #ai-chat-history::-webkit-scrollbar-track { background:var(--s2); }
        #ai-chat-history::-webkit-scrollbar-thumb { background:var(--bd2); border-radius:2px; }
    </style>
</head>
<body id="body-root">
    <div id="app"></div>
    <div id="modal-root"></div>
    <div id="toast-root" style="position:fixed; top:60px; right:20px; z-index:1000; display:flex; flex-direction:column; gap:8px;"></div>

    <script>
        'use strict';
        const PAIRS = {
            EURUSD:{pip:.0001,d:5,sp:.00012,sess:'EU/US',flag:'🇪🇺🇺🇸',base:1.16500},
            GBPUSD:{pip:.0001,d:5,sp:.00018,sess:'UK/US',flag:'🇬🇧🇺🇸',base:1.34500},
            USDJPY:{pip:.01,  d:3,sp:.018,  sess:'AS/US',flag:'🇺🇸🇯🇵',base:158.600},
            AUDUSD:{pip:.0001,d:5,sp:.0002, sess:'AS/US',flag:'🇦🇺🇺🇸',base:0.72350},
            USDCAD:{pip:.0001,d:5,sp:.0002, sess:'US/CA',flag:'🇺🇸🇨🇦',base:1.35700},
            USDCHF:{pip:.0001,d:5,sp:.0002, sess:'EU/US',flag:'🇺🇸🇨🇭',base:0.88900},
            NZDUSD:{pip:.0001,d:5,sp:.00025,sess:'AS/US',flag:'🇳🇿🇺🇸',base:0.65800},
            EURGBP:{pip:.0001,d:5,sp:.00016,sess:'EU',   flag:'🇪🇺🇬🇧',base:0.86250},
        };
        const SYMS = Object.keys(PAIRS);

        const S = {
            tab: 'dashboard', pair: 'EURUSD', theme: 'dark', aiHistory: [],
            timeframe: '15m',
            prices: {}, candles: {},
            fundamentalBias: {}, // { SYMBOL: 1 | 0 | -1 }
            chart: null, chartSeries: null,
            src: 'simulation',
            provider: localStorage.getItem('fx_provider') || 'polygon',
            apiKey: localStorage.getItem('polygon_key') || '',
            oandaToken: localStorage.getItem('oanda_token') || '',
            oandaAccountId: localStorage.getItem('oanda_account_id') || '',
            btResult: null, btRunning: false
        };
        const TFs = ['1m', '5m', '15m', '1h', '4h', '1d', '1w', '1M', '1Y'];

        function initData() {
            SYMS.forEach(s => {
                const base = PAIRS[s].base;
                S.prices[s] = { bid: base, ask: base + PAIRS[s].sp, mid: base, chg: 0, pct: 0, vol: 0, src: 'seed' };
                S.candles[s] = {};
                TFs.forEach(tf => {
                    S.candles[s][tf] = _genSeedCandles(s, base, tf);
                });
            });
        }

        function _genSeedCandles(sym, base, tf, n=200) {
            let p = base;
            const vol = PAIRS[sym].pip * 4;
            const candles = [];
            const interval = getTfMs(tf);
            for(let i=0; i<n; i++) {
                const o = p, d = (Math.random()-.5)*vol*2, c = o+d;
                p = c;
                candles.push({ t: Date.now()-(n-i)*interval, o, h: Math.max(o,c)+0.0001, l: Math.min(o,c)-0.0001, c, v: Math.floor(Math.random()*1000) });
            }
            return candles;
        }

        function getTfMs(tf) {
            const map = { '1m': 60000, '5m': 300000, '15m': 900000, '1h': 3600000, '4h': 14400000, '1d': 86400000, '1w': 604800000, '1M': 2592000000, '1Y': 31536000000 };
            return map[tf] || 60000;
        }

        const _ema = (d, p) => {
            const k = 2/(p+1);
            const res = [];
            for(let i=0; i<d.length; i++) {
                if(i===0) res.push(d[i]);
                else res.push(d[i]*k + res[i-1]*(1-k));
            }
            return res;
        };
        const _sma = (d, p) => {
            if (d.length < p) return null;
            let sum = 0;
            for(let i = d.length - p; i < d.length; i++) sum += d[i];
            return sum / p;
        };
        const _stdDev = (d, p, sma) => {
            if (d.length < p) return null;
            let sumSq = 0;
            for(let i = d.length - p; i < d.length; i++) sumSq += Math.pow(d[i] - sma, 2);
            return Math.sqrt(sumSq / p);
        };
        const _atr = (c, p) => {
            if (c.length < p + 1) return 0;
            let trs = [];
            for (let i = 1; i < c.length; i++) {
                const h = c[i].h, l = c[i].l, pc = c[i-1].c;
                trs.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
            }
            return _sma(trs, p) || 0;
        };

        const _rsi = (c) => {
            if(c.length < 15) return 50;
            let gains = 0, losses = 0;
            for(let i=c.length-14; i<c.length; i++) {
                let diff = c[i] - c[i-1];
                diff > 0 ? gains += diff : losses -= diff;
            }
            return 100 - (100 / (1 + (gains/14) / (losses/14 || 1)));
        };

        function computeSignal(sym, tf = S.timeframe) {
            const candles = S.candles[sym][tf];
            if (!candles || candles.length < 200) return { dir: 'NEUTRAL', conf: 0, rsi: 50, last: 0, risk: 'Normal' };

            const cl = candles.map(c => c.c);
            const last = cl[cl.length-1];

            // 1. Indicators
            const rsi = _rsi(cl);
            const ema200 = _ema(cl, 200);
            const lastEma = ema200[ema200.length-1];
            const prevEma = ema200[ema200.length-2];
            const sma20 = _sma(cl, 20);
            const std = _stdDev(cl, 20, sma20);
            const atr = _atr(candles, 14);

            const upperBand = sma20 + (std * 2);
            const lowerBand = sma20 - (std * 2);

            // 2. Dimension Scoring
            let tScore = 0, vScore = 0, mScore = 0;

            // Trend Dimension (Slope + Relative Position)
            const isPriceAboveEma = last > lastEma;
            const isEmaRising = lastEma > prevEma;
            if (isPriceAboveEma && isEmaRising) tScore = 1;
            else if (!isPriceAboveEma && !isEmaRising) tScore = -1;
            else if (isPriceAboveEma || isEmaRising) tScore = 0.5 * (isPriceAboveEma ? 1 : -1);

            // Value Dimension (Volatility Adjusted Bands)
            const bullValueThresh = lowerBand - (atr * 0.2);
            const bearValueThresh = upperBand + (atr * 0.2);
            if (last <= bullValueThresh) vScore = 1;
            else if (last >= bearValueThresh) vScore = -1;
            else if (last <= lowerBand) vScore = 0.5;
            else if (last >= upperBand) vScore = -0.5;

            // Momentum Dimension (RSI Extremes)
            if (rsi < 30) mScore = 1;
            else if (rsi > 70) mScore = -1;
            else if (rsi < 35) mScore = 0.5;
            else if (rsi > 65) mScore = -0.5;

            // 3. Fundamental Bias Integration
            const bias = S.fundamentalBias[sym] || 0;
            const technicalScore = tScore + vScore + mScore;
            const finalScore = technicalScore + (bias * 1.2);

            let direction = 'NEUTRAL';
            if (finalScore > 0.5) direction = 'BUY';
            else if (finalScore < -0.5) direction = 'SELL';

            const conf = direction === 'NEUTRAL' ? 0 : Math.min(100, Math.abs(finalScore / 4.2 * 100) + 20);

            // 4. Professional Risk Assessment
            let risk = 'Normal';
            const isDivergent = (direction === 'BUY' && bias === -1) || (direction === 'SELL' && bias === 1);
            if (isDivergent) risk = 'High (Fundamental Divergence)';
            else if (tf !== '1h' && tf !== '4h') {
                const h1C = S.candles[sym]['1h'];
                const h4C = S.candles[sym]['4h'];
                if (h1C && h4C) {
                    const h1Trend = h1C[h1C.length-1].c > _ema(h1C.map(c=>c.c), 200).pop();
                    const h4Trend = h4C[h4C.length-1].c > _ema(h4C.map(c=>c.c), 200).pop();
                    if (direction === 'BUY' && (!h1Trend || !h4Trend)) risk = 'High (MTF Conflict)';
                    if (direction === 'SELL' && (h1Trend || h4Trend)) risk = 'High (MTF Conflict)';
                }
            }

            return { dir: direction, conf: Math.round(conf), rsi, last, risk, bias };
        }

        // Returns session % change: first candle close of current day vs latest close
        function getPctChange(sym, tf) {
            const cc = S.candles[sym][tf];
            if (!cc || cc.length < 2) return 0;
            // Use the open of the oldest candle within the last 24h as session open
            const now = Date.now();
            const dayMs = 86400000;
            const sessionCandles = cc.filter(c => now - c.t <= dayMs);
            const sessionOpen = sessionCandles.length > 0 ? sessionCandles[0].o : cc[0].o;
            const latest = cc[cc.length - 1].c;
            return sessionOpen !== 0 ? ((latest - sessionOpen) / sessionOpen) * 100 : 0;
        }

        function addToast(msg, type='buy') {
            const root = document.getElementById('toast-root');
            const t = document.createElement('div');
            t.className = `card ${type === 'buy' ? 'sig-card buy' : 'sig-card sell'}`;
            t.style.cssText = 'margin-bottom:8px; animation: fadeUp 0.3s ease; cursor:pointer;';
            t.innerHTML = `<div style="font-size:12px; font-weight:bold">${msg}</div>`;
            t.onclick = () => t.remove();
            root.appendChild(t);
            setTimeout(() => t.remove(), 5000);
        }

        function showSettings() {
            const root = document.getElementById('modal-root');
            const providerOp = S.provider === 'polygon' ? 'Polygon.io' : S.provider === 'oanda' ? 'OANDA' : 'Binance';
            root.innerHTML = `
                <div class="modal-bg" onclick="this.remove()">
                    <div class="modal" onclick="event.stopPropagation()">
                        <h2 style="font-family:var(--fd); color:var(--acc); margin-bottom:10px">API SETTINGS</h2>
                        <div style="display:flex; gap:8px; margin-bottom:15px">
                            <button class="btn ${S.provider === 'polygon' ? 'btn-acc' : 'btn-ghost'}" style="flex:1" onclick="S.provider='polygon'; showSettings()">Polygon</button>
                            <button class="btn ${S.provider === 'oanda' ? 'btn-acc' : 'btn-ghost'}" style="flex:1" onclick="S.provider='oanda'; showSettings()">OANDA</button>
                            <button class="btn ${S.provider === 'binance' ? 'btn-acc' : 'btn-ghost'}" style="flex:1" onclick="S.provider='binance'; showSettings()">Binance</button>
                        </div>
                        <p style="font-size:11px; color:var(--muted); margin-bottom:15px">Configure credentials for ${providerOp}.</p>
                        ${S.provider === 'polygon' ? `
                            <label style="font-size:10px; color:var(--muted); font-family:var(--fm)">POLYGON API KEY</label>
                            <input class="inp" type="password" id="key-inp" value="${S.apiKey}" placeholder="PK-xxxxxxxx...">
                        ` : S.provider === 'oanda' ? `
                            <label style="font-size:10px; color:var(--muted); font-family:var(--fm)">OANDA API TOKEN</label>
                            <input class="inp" type="password" id="token-inp" value="${S.oandaToken}" placeholder="Enter Token...">
                            <label style="font-size:10px; color:var(--muted); font-family:var(--fm)">OANDA ACCOUNT ID</label>
                            <input class="inp" type="text" id="acc-inp" value="${S.oandaAccountId}" placeholder="Enter Account ID...">
                        ` : `
                            <div style="text-align:center; padding:20px; color:var(--acc); font-family:var(--fm); font-size:12px; border:1px dashed var(--bd); border-radius:8px">
                                No API Key Required for Binance
                            </div>
                        `}
                        <button class="btn btn-acc" style="width:100%; margin-top:20px" onclick="saveKey()">SAVE & CONNECT</button>
                    </div>
                </div>
            `;
        }

        function saveKey() {
            localStorage.setItem('fx_provider', S.provider);
            if (S.provider === 'polygon') {
                const key = document.getElementById('key-inp').value;
                S.apiKey = key;
                localStorage.setItem('polygon_key', key);
            } else if (S.provider === 'oanda') {
                const token = document.getElementById('token-inp').value;
                const acc = document.getElementById('acc-inp').value;
                S.oandaToken = token;
                S.oandaAccountId = acc;
                localStorage.setItem('oanda_token', token);
                localStorage.setItem('oanda_account_id', acc);
            }
            document.getElementById('modal-root').innerHTML = '';
            startHybridEngine();
            render();
        }

        async function fetchRealPrice(sym) {
            if (S.provider === 'polygon') {
                if (!S.apiKey) return null;
                try {
                    const response = await fetch(`https://api.polygon.io/v2/last/forex/C.${sym}?apiKey=${S.apiKey}`);
                    if (!response.ok) throw new Error('Polygon API Error');
                    const data = await response.json();
                    return data.lastTrade ? data.lastTrade.p : null;
                } catch (e) {
                    console.warn(`Polygon fetch failed for ${sym}:`, e.message);
                    return null;
                }
            } else if (S.provider === 'oanda') {
                if (!S.oandaToken || !S.oandaAccountId) return null;
                try {
                    const response = await fetch(`https://api-fxpractice.oanda.com/v3/accounts/${S.oandaAccountId}/pricing`, {
                        headers: { 'Authorization': `Bearer ${S.oandaToken}` }
                    });
                    if (!response.ok) throw new Error('OANDA API Error');
                    const data = await response.json();
                    const pricing = data.prices.find(p => p.instrument === sym);
                    return pricing ? (parseFloat(pricing.bids[0].p) + parseFloat(pricing.asks[0].p)) / 2 : null;
                } catch (e) {
                    console.warn(`OANDA fetch failed for ${sym}:`, e.message);
                    return null;
                }
            } else if (S.provider === 'binance') {
                try {
                    const bSym = sym.replace('USD', 'USDT');
                    const response = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${bSym}`);
                    if (!response.ok) throw new Error('Binance API Error');
                    const data = await response.json();
                    return data.price ? parseFloat(data.price) : null;
                } catch (e) {
                    console.warn(`Binance fetch failed for ${sym}:`, e.message);
                    return null;
                }
            }
            return null;
        }

        async function pollPrices() {
            if (S.provider === 'polygon' && !S.apiKey) return;
            if (S.provider === 'oanda' && (!S.oandaToken || !S.oandaAccountId)) return;
            if (S.provider === 'binance') {
                // Binance is always available
            } else if (S.provider === 'polygon' || S.provider === 'oanda') {
                // Credentials already checked above
            }

            S.src = `${S.provider === 'polygon' ? 'Polygon.io' : S.provider === 'oanda' ? 'OANDA' : 'Binance'} (Polling)`;
            for (const s of SYMS) {
                const price = await fetchRealPrice(s);
                if (price) {
                    S.prices[s].mid = price;
                    S.prices[s].bid = price - PAIRS[s].sp/2;
                    S.prices[s].ask = price + PAIRS[s].sp/2;

                    TFs.forEach(tf => {
                        const cc = S.candles[s][tf];
                        const last = cc[cc.length-1];
                        if (Date.now() - last.t > getTfMs(tf)) {
                            cc.push({ t: Date.now(), o: price, h: price, l: price, c: price, v: 1 });
                            if(cc.length > 200) cc.shift();
                        } else {
                            last.c = price;
                            last.h = Math.max(last.h, price);
                            last.l = Math.min(last.l, price);
                        }
                    });
                }
            }
            render();
        }

        function startHybridEngine() {
            if (S.provider === 'binance' || S.apiKey || (S.oandaToken && S.oandaAccountId)) {
                pollPrices();
                setInterval(pollPrices, 15000);
            }
        }

        function setBias(sym, val) {
            S.fundamentalBias[sym] = val;
            render();
        }

        function initChart() {
            const container = document.getElementById('tv-chart-container');
            if (!container || typeof LightweightCharts === 'undefined') return;

            if (S.chart) {
                if (S.pair === S.lastChartPair && S.timeframe === S.lastChartTf) {
                    return;
                }
                S.chart.remove();
                S.chart = null;
                S.chartSeries = null;
            }

            S.lastChartPair = S.pair;
            S.lastChartTf = S.timeframe;

            try {
                S.chart = LightweightCharts.createChart(container, {
                    width: container.clientWidth,
                    height: container.clientHeight || 380,
                    layout: { background: { color: '#0d1525' }, textColor: '#4a6890' },
                    grid: { vertLines: { color: '#1e3050' }, horzLines: { color: '#1e3050' } },
                    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                    rightPriceScale: { borderColor: '#1e3050' },
                    timeScale: { borderColor: '#1e3050', timeVisible: true },
                });
                S.chartSeries = S.chart.addCandlestickSeries({
                    upColor: '#06d672', downColor: '#ff2d55',
                    borderUpColor: '#06d672', borderDownColor: '#ff2d55',
                    wickUpColor: '#06d672', wickDownColor: '#ff2d55',
                });

                const candles = S.candles[S.pair][S.timeframe];
                const chartData = candles.map(c => ({
                    time: Math.floor(c.t / 1000),
                    open: parseFloat(c.o.toFixed(PAIRS[S.pair].d)),
                    high: parseFloat(c.h.toFixed(PAIRS[S.pair].d)),
                    low: parseFloat(c.l.toFixed(PAIRS[S.pair].d)),
                    close: parseFloat(c.c.toFixed(PAIRS[S.pair].d)),
                }));
                const seen = new Set();
                const unique = chartData.filter(d => { if (seen.has(d.time)) return false; seen.add(d.time); return true; });
                unique.sort((a, b) => a.time - b.time);
                S.chartSeries.setData(unique);
                S.chart.timeScale().fitContent();
                window.addEventListener('resize', () => {
                    if (S.chart) S.chart.applyOptions({ width: container.clientWidth });
                });
            } catch(e) {
                container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#4a6890;font-family:var(--fm);font-size:12px">Chart unavailable</div>`;
            }
        }

        function updateChartRealtime() {
            if (!S.chart || !S.chartSeries || S.tab !== 'dashboard') return;
            const candles = S.candles[S.pair][S.timeframe];
            const last = candles[candles.length - 1];
            S.chartSeries.update({
                time: Math.floor(last.t / 1000),
                open: parseFloat(last.o.toFixed(PAIRS[S.pair].d)),
                high: parseFloat(last.h.toFixed(PAIRS[S.pair].d)),
                low: parseFloat(last.l.toFixed(PAIRS[S.pair].d)),
                close: parseFloat(last.c.toFixed(PAIRS[S.pair].d)),
            });
        }

        function updateSessionMonitor() {
            const now = new Date();
            const utcH = now.getUTCHours();
            const utcM = now.getUTCMinutes();
            const utcMins = utcH * 60 + utcM;

            const sessions = {
                tokyo:  { start: 0*60,   end: 9*60   },
                london: { start: 7*60,   end: 16*60  },
                ny:     { start: 12*60,  end: 21*60  },
            };

            let activeSessions = 0;
            const marketOpen = isMarketOpen();
            for (const [name, s] of Object.entries(sessions)) {
                const isActive = marketOpen && utcMins >= s.start && utcMins < s.end;
                const dot = document.getElementById(`dot-${name}`);
                const lbl = document.getElementById(`sess-${name}`);
                if (dot) dot.className = 'session-dot' + (isActive ? ' active' : '');
                if (lbl) lbl.style.color = isActive ? 'var(--acc)' : 'var(--muted)';
                if (isActive) activeSessions++;
            }

            const overlap = document.getElementById('session-overlap');
            if (overlap) {
                const londonNYOverlap = isMarketOpen() && utcMins >= 12*60 && utcMins < 16*60;
                overlap.style.display = londonNYOverlap ? 'block' : 'none';
            }
            const wb = document.getElementById('weekend-banner');
            if (wb) wb.style.display = isMarketOpen() ? 'none' : 'block';
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            const tickerItems = SYMS.map(s => {
                const p = S.prices[s];
                const tChg = getPctChange(s, '1h');
                const tChgColor = tChg >= 0 ? 'var(--buy)' : 'var(--sell)';
                const tChgStr = (tChg >= 0 ? '+' : '') + tChg.toFixed(2) + '%';
                return `<div style="display:inline-flex; align-items:center; gap:10px; padding:0 20px; border-right:1px solid var(--bd); font-family:var(--fm); font-size:10px;">
                    <span>${PAIRS[s].flag} ${s}</span>
                    <span style="font-weight:bold">${p.bid.toFixed(PAIRS[s].d)}</span>
                    <span style="color:${tChgColor}">${tChgStr}</span>
                </div>`;
            }).join('');



            let content = '';
            if (S.tab === 'dashboard') {
                const p = S.prices[S.pair];
                const sig = computeSignal(S.pair, S.timeframe);
                const sigH1 = computeSignal(S.pair, '1h');
                const sigH4 = computeSignal(S.pair, '4h');
                const sigD1 = computeSignal(S.pair, '1d');

                // Compute volatility from 20-period std dev of closes
                const cl = S.candles[S.pair][S.timeframe].map(c => c.c);
                const sma20 = cl.length >= 20 ? cl.slice(-20).reduce((a,b)=>a+b,0)/20 : cl[cl.length-1];
                const std20 = cl.length >= 20 ? Math.sqrt(cl.slice(-20).reduce((a,b)=>a+Math.pow(b-sma20,2),0)/20) : 0;
                const volPips = std20 / PAIRS[S.pair].pip;
                const volLabel = volPips < 5 ? 'LOW' : volPips < 15 ? 'MODERATE' : 'HIGH';
                const volColor = volPips < 5 ? 'var(--buy)' : volPips < 15 ? 'var(--amber)' : 'var(--sell)';

                // Trend from EMA200
                const ema200 = _ema(cl, 200);
                const lastEma = ema200[ema200.length-1];
                const lastClose = cl[cl.length-1];
                const trendLabel = lastClose > lastEma ? 'BULLISH' : lastClose < lastEma ? 'BEARISH' : 'NEUTRAL';
                const trendColor = trendLabel === 'BULLISH' ? 'var(--buy)' : trendLabel === 'BEARISH' ? 'var(--sell)' : 'var(--muted)';

                // Session % change derived from candle data
                const chgPctRaw = getPctChange(S.pair, S.timeframe);
                const chgPct = chgPctRaw.toFixed(2);
                const chgColor = chgPctRaw >= 0 ? 'var(--buy)' : 'var(--sell)';
                const chgSign = chgPctRaw >= 0 ? '+' : '';

            const ss = String(now.getUTCSeconds()).padStart(2,'0');
            const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const cl = document.getElementById('sidebar-utc-clock');

            if (cl) cl.textContent = hh+':'+mm+':'+ss;

        function isMarketOpen() {
            const now = new Date();
            const day = now.getUTCDay();
            const utcMins = now.getUTCHours() * 60 + now.getUTCMinutes();
            if (day === 6) return false;
            if (day === 0 && utcMins < 21 * 60) return false;
            if (day === 5 && utcMins >= 22 * 60) return false;
            return true;
        }

            const now = new Date();
            const day = now.getUTCDay();
            const daysToSun = day === 0 ? 0 : 7 - day;
            const target = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + daysToSun, 21, 0, 0, 0));
            if (now >= target) target.setUTCDate(target.getUTCDate() + 7);
            const diff = Math.max(0, target - now);
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        }

        function _simTick() {
            if (!isMarketOpen()) {
                const ct = getMondayOpenCountdown();
                ['market-countdown','dashboard-countdown','sidebar-countdown'].forEach(function(id) {
                    const el = document.getElementById(id);
                    if (el) el.textContent = ct;
                });
                _updateSidebarClock();
                return;
            }
            if (S.src === 'Polygon.io (Polling)') return;
            SYMS.forEach(s => {
                const p = S.prices[s];
                const noise = (Math.random() - 0.5) * PAIRS[s].pip * 2;
                p.mid += noise;
                p.bid = p.mid - PAIRS[s].sp/2;
                p.ask = p.mid + PAIRS[s].sp/2;

                TFs.forEach(tf => {
                    const cc = S.candles[s][tf];
                    const last = cc[cc.length-1];
                    if (Date.now() - last.t > getTfMs(tf)) {
                        cc.push({ t: Date.now(), o: p.mid, h: p.mid, l: p.mid, c: p.mid, v: 1 });
                        if(cc.length > 200) cc.shift();
                    } else {
                        last.c = p.mid;
                        last.h = Math.max(last.h, p.mid);
                        last.l = Math.min(last.l, p.mid);
                    }
                });
            });
            updateChartRealtime();
            render();
        }

        function getSignalNote(sym, sig) {
            const rsi = Math.round(sig.rsi);
            const dir = sig.dir;
            const risk = sig.risk;
            const trend = sig.last > _ema(S.candles[sym]['1h'].map(c=>c.c), 200).pop() ? 'bullish' : 'bearish';
            const chg = getPctChange(sym, '1h');

            if (dir === 'NEUTRAL') {
                if (rsi > 48 && rsi < 52) return 'Price consolidating near EMA200 — no edge yet. Wait for breakout confirmation.';
                if (rsi >= 52 && rsi <= 65) return 'Mild bullish momentum but no confirmed signal. Watch for pullback entry.';
                if (rsi >= 35 && rsi < 48) return 'Mild bearish lean. Price below EMA, no oversold bounce yet — stay patient.';
                return 'Mixed signals across timeframes. Avoid trading until conditions align.';
            }
            if (dir === 'BUY') {
                const rsiNote = rsi < 35 ? 'RSI deeply oversold — strong mean-reversion potential.' : rsi < 45 ? 'RSI recovering from lows — momentum building.' : 'RSI neutral but price at value zone.';
                const riskNote = risk !== 'Normal' ? ' ⚠ Counter-trend on 1H — reduce size.' : '';
                const chgNote = chg < -0.1 ? ' Session pulling back — wait for stabilisation before entry.' : '';
                return `${rsiNote} Price in bullish trend, touching lower Bollinger Band.${riskNote}${chgNote}`;
            }
            if (dir === 'SELL') {
                const rsiNote = rsi > 65 ? 'RSI overbought — exhaustion likely near.' : rsi > 55 ? 'RSI elevated, losing steam.' : 'RSI neutral but price at value zone.';
                const riskNote = risk !== 'Normal' ? ' ⚠ Counter-trend on 1H — reduce size.' : '';
                const chgNote = chg > 0.1 ? ' Session pushing higher — wait for rejection candle before entry.' : '';
                return `${rsiNote} Price in bearish trend, touching upper Bollinger Band.${riskNote}${chgNote}`;
            }
            return '';
        }

        function buildLiveContext() {
            // Dynamically build system context from live app signals + prices
            const lines = ['You are a professional forex market analyst inside a live trading app. You have access to the current live market data below. Be concise, direct, and practical. Format responses with clear structure using **bold** for key points and bullet points where helpful. Max 200 words.', ''];
            lines.push('=== LIVE MARKET DATA (as of now) ===');
            SYMS.forEach(s => {
                const p = S.prices[s];
                const sig1h = computeSignal(s, '1h');
                const sig4h = computeSignal(s, '4h');
                const chg = getPctChange(s, '1h');
                const cl = S.candles[s]['1h'].map(c => c.c);
                const ema200 = _ema(cl, 200);
                const trend = cl[cl.length-1] > ema200[ema200.length-1] ? 'BULLISH' : 'BEARISH';
                lines.push(`${s}: bid=${p.bid.toFixed(PAIRS[s].d)} chg=${chg>=0?'+':''}${chg.toFixed(2)}% | 1H=${sig1h.dir}(${sig1h.conf}%) 4H=${sig4h.dir}(${sig4h.conf}%) | RSI=${Math.round(sig1h.rsi)} | Trend=${trend}`);
            });
            lines.push('');
            lines.push('=== WEEKLY ANALYSIS (May 19, 2026) ===');
            lines.push('- USD dominant: DXY ~99.10 (2-week high). Driver: US-China trade optimism + hawkish Fed repricing (no cuts in 2026 expected)');
            lines.push('- EUR/USD: below 1.1710 support → bearish. Entry 1.1650-80, SL 1.1720, T1 1.1580, T2 1.1460. R:R ~3:1');
            lines.push('- GBP/USD: worst week in months (−2%), trendline broken at 1.3450. UK political instability. SL 1.3530, T1 1.3380, T2 1.3300');
            lines.push('- USD/JPY: 5-day rally to 158.60. BOJ hawkish but yen weak. HARD CAP at 159.50 — MoF intervention zone at 160.00');
            lines.push('- USD/CAD: trending lower to 1.3500 — WTI oil ~$100/bbl boosting CAD');
            lines.push('- EUR/GBP: ranging 0.8600-0.8750. Long from 0.8610, SL 0.8580, T 0.8700. R:R ~3:1');
            lines.push('- AUD/USD: rejected at 0.7270 resistance. Wait for 0.7235-50 support to hold before entering');
            lines.push('');
            lines.push('=== KEY RISK EVENTS THIS WEEK ===');
            lines.push('- Tue: Fed speakers (hawkish risk → USD up)');
            lines.push('- Wed: FOMC minutes (biggest event — USD volatile)');
            lines.push('- Thu: US jobless claims + UK political developments');
            lines.push('- Daily: US-Iran talks / Strait of Hormuz (oil wildcard → USD safe-haven bid)');
            lines.push('');
            lines.push('=== RISK RULES ===');
            lines.push('Max 1% risk per trade. Min 1:2 R:R. No trades 30min around news. USD/JPY cap 159.50. Scale out 50% at T1. Weekly drawdown limit −3%.');
            return lines.join('\n');
        }

        function formatAIResponse(text) {
            // Convert markdown-like formatting to HTML
            return text
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/^\* (.+)$/gm, '<li>$1</li>')
                .replace(/^- (.+)$/gm, '<li>$1</li>')
                .replace(/(<li>.*<\/li>\n?)+/g, m => '<ul style="margin:6px 0 6px 16px; padding:0;">'+m+'</ul>')
                .replace(/\n\n/g, '</p><p style="margin:6px 0;">')
                .replace(/\n/g, '<br>')
                .replace(/^(.+)$/, '<p style="margin:0;">$1</p>');
        }

        // ── AI IS BUSY FLAG — prevents render() from wiping the input mid-request ──
        let _aiWorking = false;

        async function askAI() {
            if (_aiWorking) return;
            const q = document.getElementById('ai-question');
            if (!q || !q.value.trim()) return;

            const question = q.value.trim();
            q.value = '';
            q.disabled = true;
            _aiWorking = true;

            const sendBtn = document.getElementById('ai-send-btn');
            if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = '...'; }

            // Append user bubble directly to DOM — do NOT call render() which destroys the input
            _appendChatBubble('user', question, question);
            const sb = document.getElementById('ai-streaming-box');
            if (sb) { sb.style.display = 'block'; sb.className = 'ai-response-box loading'; sb.innerHTML = '<span style="opacity:0.6">AI Analyst is thinking…</span><span class="ai-cursor">▋</span>'; }
            const chat = document.getElementById('ai-chat-history');
            if (chat) chat.scrollTop = chat.scrollHeight;

            // Build correct messages array: all previous history + current question
            // FIX: was using slice(0,-1) then pushing again — caused duplicate user msgs
            const messages = S.aiHistory.map(m => ({ role: m.role, content: m.content }));
            messages.push({ role: 'user', content: question });

            // Push to history now so it's preserved on next render
            S.aiHistory.push({ role: 'user', content: question, html: question });

            try {
                const res = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 1000,
                        system: buildLiveContext(),
                        messages,
                        tools: [{ type: 'web_search_20250305', name: 'web_search' }]
                    })
                });

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `HTTP ${res.status}`);
                }

                const data = await res.json();
                if (data.error) throw new Error(data.error.message || 'API error');

                // Collect all text content blocks (handles tool_use interleaving)
                const fullText = (data.content || [])
                    .filter(b => b.type === 'text')
                    .map(b => b.text)
                    .join('') || 'No response received.';

                const formattedHTML = formatAIResponse(fullText);
                S.aiHistory.push({ role: 'assistant', content: fullText, html: formattedHTML });

                // Update streaming box → real response, don't re-render
                if (sb) {
                    sb.className = 'ai-response-box';
                    sb.innerHTML = formattedHTML;
                    sb.style.display = 'block';
                }
                _appendChatBubble('assistant', fullText, formattedHTML);
                if (sb) sb.style.display = 'none';

            } catch(e) {
                const errMsg = e.message && e.message.length < 200 ? e.message : 'Connection error. Check network and try again.';
                const errHTML = `<span style="color:var(--sell)">⚠ ${errMsg}</span>`;
                S.aiHistory.push({ role: 'assistant', content: errMsg, html: errHTML });
                if (sb) { sb.className = 'ai-response-box'; sb.innerHTML = errHTML; }
                _appendChatBubble('assistant', errMsg, errHTML);
                if (sb) sb.style.display = 'none';
            } finally {
                _aiWorking = false;
                if (q) { q.disabled = false; q.focus(); }
                if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = 'ASK ↗'; }
                const chat2 = document.getElementById('ai-chat-history');
                if (chat2) chat2.scrollTop = chat2.scrollHeight;
            }
        }

        // Append a single bubble to the chat history div without re-rendering
        function _appendChatBubble(role, content, html) {
            const chat = document.getElementById('ai-chat-history');
            if (!chat) return;
            const isUser = role === 'user';
            const wrap = document.createElement('div');
            wrap.style.cssText = `display:flex;flex-direction:column;gap:6px;align-items:${isUser?'flex-end':'flex-start'};`;
            wrap.innerHTML = `
                <div style="font-size:9px;color:var(--muted);font-family:var(--fm);${isUser?'text-align:right':''}">
                    ${isUser ? 'YOU' : 'AI ANALYST'}
                </div>
                <div style="
                    max-width:85%;padding:10px 14px;
                    border-radius:${isUser?'12px 12px 2px 12px':'12px 12px 12px 2px'};
                    background:${isUser?'var(--acc)':'var(--s2)'};
                    color:${isUser?'#020c18':'var(--txt)'};
                    font-size:13px;line-height:1.6;
                    border:1px solid ${isUser?'transparent':'var(--bd)'};
                ">${html || content}</div>`;
            chat.appendChild(wrap);
            chat.scrollTop = chat.scrollHeight;
        }

        function calcRM() {
            const bal = parseFloat(document.getElementById('rm-balance')?.value) || 10000;
            const riskPct = parseFloat(document.getElementById('rm-risk')?.value) || 1;
            const sl = parseFloat(document.getElementById('rm-sl')?.value) || 30;
            const rr = parseFloat(document.getElementById('rm-rr')?.value) || 2;
            const pipValPerLot = parseFloat(document.getElementById('rm-pair-type')?.value) || 10;

            const riskAmt = bal * (riskPct / 100);
            const lotSize = riskAmt / (sl * pipValPerLot);
            const tpPips = sl * rr;
            const reward = riskAmt * rr;

            const riskOut = document.getElementById('rm-risk-out');
            const slOut = document.getElementById('rm-sl-out');
            const rrOut = document.getElementById('rm-rr-out');
            const riskAmtEl = document.getElementById('rm-risk-amt');
            const lotEl = document.getElementById('rm-lot');
            const tpEl = document.getElementById('rm-tp-pips');
            const rewEl = document.getElementById('rm-reward');

            if(riskOut) riskOut.textContent = riskPct.toFixed(1) + '%';
            if(slOut) slOut.textContent = sl + ' pips';
            if(rrOut) rrOut.textContent = '1:' + rr.toFixed(1);
            if(riskAmtEl) riskAmtEl.textContent = '$' + Math.round(riskAmt);
            if(lotEl) lotEl.textContent = lotSize.toFixed(2);
            if(tpEl) tpEl.textContent = Math.round(tpPips);
            if(rewEl) rewEl.textContent = '$' + Math.round(reward);
        }

        initData();
        document.body.className = S.theme;
        startHybridEngine();
        render();
        setInterval(_simTick, 1000);

    </script>
